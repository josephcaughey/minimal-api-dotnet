name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t bookings-api .
      - name: Smoke test the image
        run: |
          docker run -d --name api -p 8080:8080 bookings-api
          for i in $(seq 1 30); do curl -sf localhost:8080/health && break; sleep 1; done
          curl -sf -X POST localhost:8080/rooms -H 'Content-Type: application/json' \
            -d '{"name":"Arbutus","capacity":6}'
          curl -sf localhost:8080/rooms | grep -q Arbutus
      - if: failure()
        run: docker logs api
